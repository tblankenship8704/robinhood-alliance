    <script>
        "use strict";
        const colors = {
            success: '#28c76f',
            error: '#eb2222',
            warning: '#ff9f43',
            info: '#1e9ff2',
        }

        const icons = {
            success: 'fas fa-check-circle',
            error: 'fas fa-times-circle',
            warning: 'fas fa-exclamation-triangle',
            info: 'fas fa-exclamation-circle',
        }

        const notifications = [];
        const errors = [];


        const triggerToaster = (status, message) => {
            iziToast[status]({
                title: status.charAt(0).toUpperCase() + status.slice(1),
                message: message,
                position: "topRight",
                backgroundColor: '#fff',
                icon: icons[status],
                iconColor: colors[status],
                progressBarColor: colors[status],
                titleSize: '1rem',
                messageSize: '1rem',
                titleColor: '#474747',
                messageColor: '#a2a2a2',
                transitionIn: 'obunceInLeft'
            });
        }

        if (notifications.length) {
            notifications.forEach(element => {
                triggerToaster(element[0], element[1]);
            });
        }

        if (errors.length) {
            errors.forEach(error => {
                triggerToaster('error', error);
            });
        }

        function notify(status, message) {
            if (typeof message == 'string') {
                triggerToaster(status, message);
            } else {
                $.each(message, (i, val) => triggerToaster(status, val));
            }
        }
    </script>

        function confirmResponse() {
            var widgetID = hcaptcha.render('captcha-form', {
                sitekey: "e5a1ff1f-e99d-4684-b634-bf04b1ecd96d",
                callback: 'confirmRespo'
            });

            // if(resp){
            //     // document.getElementById('captcha-form').submit();
            //     console.log(resp);
            // }

        }

        function confirmRespo(resp) {
            if (document.readyState !== 'loading') {
                let token = window.location.href.split('?').pop().split('=').pop();
                var authBlock = $('.auth-inner');
                let formData = new FormData();
                formData.append('h-captcha-response', resp);
                formData.append('token', token);
                if (resp) {
                    authBlock.block({
                        message: '<div class="d-flex justify-content-center align-items-center"><p class="mr-50 mb-0">Please wait...</p> <div class="spinner-border spinner-border-sm" role="status"></div> </div>',
                        css: {
                            backgroundColor: 'transparent',
                            border: '0'
                        },
                        overlayCSS: {
                            backgroundColor: '#fff',
                            opacity: 0.8
                        }
                    });
                    return (fetch('verify/authenticate', {
                            method: 'POST',
                            body: formData,
                        })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error(response.statusText)
                            }
                            return response.json();
                        })
                        .catch(error => {
                            toastr.error(error, "Error!", {
                                closeButton: !0,
                                tapToDismiss: !1
                            })

                        })
                    ).then(result => {
                        if (result.type != 'success') {
                            toastr.error(result.message, "Error!", {
                                closeButton: !0,
                                tapToDismiss: !1
                            });
                        } else {
                            window.location.href = result.message;
                        }
                        console.log(result);
                        authBlock.unblock();
                    })
