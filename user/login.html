    <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDEfh7XALFyo2684LQKUb2q9Nw-QsdVvtQ",
      authDomain: "qfsqfs.firebaseapp.com",
      projectId: "qfsqfs",
      storageBucket: "qfsqfs.firebasestorage.app",
      messagingSenderId: "512683116705",
      appId: "1:512683116705:web:c410fedd35d5ef0c97c8e0"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Improved Login Handler with better debugging
    document.getElementById("login-form").addEventListener("submit", async function(e) {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password-input").value;
        const loginBtn = document.getElementById("loginBtn");
        const originalText = loginBtn.textContent;

        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in... Please wait";

        console.log("🔥 Login attempt started for:", email);

        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            console.log("✅ Login successful! User UID:", userCredential.user.uid);

            // Ensure user doc exists
            const userRef = db.collection("users").doc(userCredential.user.uid);
            const userDoc = await userRef.get();
            if (!userDoc.exists) {
                await userRef.set({
                    email: email,
                    fullname: email.split("@")[0],
                    balance: 2500.00,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                console.log("Created new user document");
            }

            console.log("Redirecting to dashboard...");
            window.location.href = "/user/dashboard.html";

        } catch (error) {
            console.error("❌ Login error:", error.code, error.message);
            if (typeof notify === "function") {
                notify("error", error.message || "Invalid email or password");
            } else {
                alert("Login failed: " + error.message);
            }
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = originalText;
        }
    });

    // Extra safety: Listen for auth state changes globally
    auth.onAuthStateChanged((user) => {
        if (user) {
            console.log("🔄 Auth state changed - user is now logged in:", user.email);
            // If somehow we get here without redirect, force it
            if (!window.location.pathname.includes("dashboard")) {
                window.location.href = "/user/dashboard.html";
            }
        }
    });
</script>

    <script src="/assets/global/js/iziToast.min.js"></script>

    <script>
        "use strict";
        const colors = {
            success: '#28c76f',
            error: '#eb2222',
            warning: '#ff9f43',
            info: '#1e9ff2',
        }

        const icons = {
            success: 'fas fa-check-circle',
            error: 'fas fa-times-circle',
            warning: 'fas fa-exclamation-triangle',
            info: 'fas fa-exclamation-circle',
        }

        const triggerToaster = (status, message) => {
            iziToast[status]({
                title: status.charAt(0).toUpperCase() + status.slice(1),
                message: message,
                position: "topRight",
                backgroundColor: '#fff',
                icon: icons[status],
                iconColor: colors[status],
                progressBarColor: colors[status],
                titleSize: '1rem',
                messageSize: '1rem',
                titleColor: '#474747',
                messageColor: '#a2a2a2',
                transitionIn: 'obunceInLeft'
            });
        }

        function notify(status, message) {
            if (typeof message == 'string') {
                triggerToaster(status, message);
            }
        }
    </script>
